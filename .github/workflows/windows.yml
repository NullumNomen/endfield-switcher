name: Windows CI and draft release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft release tag, e.g. v2.0.0-rc.1 (base must match Cargo.toml)'
        required: true
        default: v2.0.0-rc.1
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
  RUST_TOOLCHAIN: 1.95.0

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned MSVC Rust with formatting and lint tools
        run: |
          rustup toolchain install "${env:RUST_TOOLCHAIN}-x86_64-pc-windows-msvc" --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default "${env:RUST_TOOLCHAIN}-x86_64-pc-windows-msvc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-windows-msvc-${{ hashFiles('Cargo.lock') }}
      - name: Validate requested tag and select artifact label
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_TAG } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          if ($tag) {
            if ($tag -notmatch '^v(?<base>\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag' }
            $base = $Matches.base
            $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
            $version = ($metadata.packages | Where-Object name -eq 'endfield-switcher').version
            if ($base -ne $version) { throw "Tag $tag does not match Cargo version $version" }
          }
          $label = if ($tag) { $tag } else { 'ci-' + $env:GITHUB_SHA.Substring(0, 12) }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine source commit' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build Windows x64 executable
        run: cargo build --release --locked
      - name: Package executable, example config and checksums
        env:
          PACKAGE_LABEL: ${{ steps.version.outputs.label }}
          SOURCE_COMMIT: ${{ steps.version.outputs.commit }}
        run: ./scripts/package.ps1 -Label $env:PACKAGE_LABEL -Commit $env:SOURCE_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EndfieldSwitcher-windows-x64
          path: |
            dist/EndfieldSwitcher.exe
            dist/EndfieldSwitcher-*-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.json
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: EndfieldSwitcher-windows-x64
          path: dist
      - name: Create or update draft release without publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: ./scripts/draft-release.ps1 -Tag $env:RELEASE_TAG -Commit $env:SOURCE_COMMIT -Repository $env:GITHUB_REPOSITORY
